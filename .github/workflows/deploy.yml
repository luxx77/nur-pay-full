name: Deploy backend

on:
  push:
    branches:
      - main # поменяй на нужную ветку, например feat/nurpay-v2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash /opt/nurpay/backend/deploy/deploy.sh ${{ github.ref_name }}
